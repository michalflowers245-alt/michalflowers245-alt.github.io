  <script>(function initializeShell(){
  const root=document.documentElement;
  const menu=document.querySelector('.menu-toggle'), nav=document.querySelector('#primary-navigation'),theme=document.querySelector('.theme-toggle');
  const compact=matchMedia('(max-width:780px)'),systemTheme=matchMedia('(prefers-color-scheme: dark)');
  let choice=['light','dark'].includes(root.dataset.themeChoice)?root.dataset.themeChoice:null;
  let lastStoredChoice=choice,memoryOnlyChoice=false;
  const syncTheme=()=>{const dark=root.dataset.theme==='dark';theme.setAttribute('aria-label',dark?'切换为浅色主题':'切换为深色主题');document.querySelector('[data-theme-color]')?.setAttribute('content',dark?'#080b0f':'#f7f7f2');};
  const applyTheme=()=>{if(choice)root.dataset.themeChoice=choice;else delete root.dataset.themeChoice;root.dataset.theme=choice||'dark';syncTheme();};
  const refreshStoredTheme=()=>{
    let saved;
    try{const value=localStorage.getItem('zhangxi-theme-reference');saved=value==='light'||value==='dark'?value:null;}catch{applyTheme();return;}
    // A returned BFCache page adopts newer persisted choices. A failed local
    // write keeps its in-memory choice unless a different valid choice appears.
    if(!memoryOnlyChoice||(saved&&saved!==lastStoredChoice)){choice=saved;memoryOnlyChoice=false;}
    lastStoredChoice=saved;applyTheme();
  };
  const menuOpen=()=>menu.getAttribute('aria-expanded')==='true';
  const firstNavLink=()=>nav.querySelector('a[href]');
  let lastFocused=null,wasCompact=compact.matches;
  const setMenu=(open,restore=false)=>{
    // Only reclaim focus when closing the region which still owns it.
    const returnFocus=!open&&compact.matches&&(restore||nav.contains(document.activeElement));
    if(returnFocus)menu.focus({preventScroll:true});
    menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'关闭导航':'打开导航');
    nav.toggleAttribute('data-open',open);if(open)nav.scrollTop=0;
  };
  theme.addEventListener('click',()=>{choice=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('zhangxi-theme-reference',choice);lastStoredChoice=choice;memoryOnlyChoice=false;}catch{memoryOnlyChoice=true;}applyTheme();});
  systemTheme.addEventListener('change',()=>{if(!choice)applyTheme();});
  window.addEventListener('pageshow',refreshStoredTheme);
  window.addEventListener('storage',event=>{if(event.key===null||event.key==='zhangxi-theme-reference')refreshStoredTheme();});
  menu.addEventListener('click',event=>{
    const open=!menuOpen();setMenu(open);
    // Keyboard / assistive activation enters the disclosure; pointer opening does not steal focus.
    if(open&&event.detail===0)firstNavLink()?.focus({preventScroll:true});
  });
  menu.addEventListener('keydown',event=>{
    // Also support switching from a pointer-opened disclosure to keyboard navigation.
    if(event.key==='Tab'&&!event.shiftKey&&menuOpen()){
      event.preventDefault();firstNavLink()?.focus({preventScroll:true});
    }
  });
  nav.addEventListener('click',event=>{
    if(event.target.closest('a')&&event.button===0&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&!event.altKey)setMenu(false);
  });
  document.addEventListener('focusin',event=>{
    lastFocused=event.target;
    // This is a non-modal disclosure: forward and reverse Tab may leave it normally.
    if(menuOpen()&&!nav.contains(event.target)&&event.target!==menu)setMenu(false);
  });
  document.addEventListener('focusout',event=>{
    // Preserve the owner when CSS hides it, regardless of media-query/blur order.
    // A move from a visible control to blank content is not a resize focus request.
    if(!event.relatedTarget&&compact.matches===wasCompact&&event.target.getClientRects().length)lastFocused=null;
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&menuOpen()){event.preventDefault();setMenu(false,true);}
  });
  document.addEventListener('click',event=>{if(!event.target.closest('.site-header')&&menuOpen())setMenu(false);});
  compact.addEventListener('change',()=>{
    const active=document.activeElement===document.body?lastFocused:document.activeElement;
    const toMenu=compact.matches&&nav.contains(active),toNav=!compact.matches&&active===menu;
    wasCompact=compact.matches;setMenu(false);
    if(toMenu)menu.focus({preventScroll:true});else if(toNav)firstNavLink()?.focus({preventScroll:true});
  });applyTheme();root.classList.add('has-js');
})();</script>
